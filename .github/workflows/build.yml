name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -e BUILDOZER_WARN_ON_ROOT=0 \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            -v ${{ github.workspace }}/.buildozer:/root/.buildozer \
            kivy/buildozer -c '
              cd /home/user/hostcwd

              # Force accept licenses
              mkdir -p /root/.buildozer/android/platform/android-sdk/licenses
              echo -e "\n24333f8a63b6825ea9c5514f6c6846ee" > /root/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
              echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > /root/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
              echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" > /root/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
              echo -e "\n24333f8a63b6825ea9c5514f6c6846ee" > /root/.android/licenses/android-sdk-license 2>/dev/null || true

              yes | buildozer -v android debug || true
              buildozer -v android debug
            '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KIRAYEDAAR-APK
          path: bin/*.apk
          if-no-files-found: warn
