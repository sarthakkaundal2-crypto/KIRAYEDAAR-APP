name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -e BUILDOZER_WARN_ON_ROOT=0 \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            -v ${{ github.workspace }}/.buildozer:/root/.buildozer \
            kivy/buildozer -c '
              cd /home/user/hostcwd
              printf "y\n" | buildozer -v android debug
            '

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KIRAYEDAAR-APK
          path: bin/*.apk
          if-no-files-found: warn
