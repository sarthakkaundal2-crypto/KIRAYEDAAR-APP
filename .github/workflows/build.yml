name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build APK using official Buildozer Docker
        run: |
          docker run --rm \
            --volume ${{ github.workspace }}:/home/user/hostcwd \
            --volume ${{ github.workspace }}/.buildozer:/home/user/.buildozer \
            kivy/buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KIRAYEDAAR-APK
          path: bin/*.apk
          if-no-files-found: warn
